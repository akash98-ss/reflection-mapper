<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflection Mapper Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        code {
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>Reflection Mapper Report</h1>

    <p>
        Parameters tested: <strong>1</strong>
    </p>

    <table>
        <thead>
            <tr>
                <th>Parameter</th>
                <th>Status</th>
                <th>Context</th>
                <th>Test URL</th>
            </tr>
        </thead>

        <tbody>
            
            <tr>
                <td>q</td>
                <td>Not reflected</td>
                <td>-</td>
                <td><code>https://example.com/search?q=XSS_REFLECTION_TEST_123456</code></td>
            </tr>
            
        </tbody>
    </table>
</body>
</html>
